<svg width="680" height="680" viewBox="0 0 680 680" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Vishu logo mark</title>
<desc>Three luminous branches — rose, cyan, and amber — rise from a single violet convergence node on a deep cosmic background, encoding the Arbor hypothesis tree, multi-agent branches, and knowledge vault.</desc>
<defs>
  <radialGradient id="bgr" cx="50%" cy="42%" r="58%">
    <stop offset="0%" stop-color="#13102b"/>
    <stop offset="100%" stop-color="#08060d"/>
  </radialGradient>
  <linearGradient id="gl" x1="340" y1="510" x2="145" y2="165" gradientUnits="userSpaceOnUse">
    <stop offset="0%" stop-color="#9d4edd"/>
    <stop offset="100%" stop-color="#ff5c8a"/>
  </linearGradient>
  <linearGradient id="gc" x1="340" y1="510" x2="340" y2="105" gradientUnits="userSpaceOnUse">
    <stop offset="0%" stop-color="#9d4edd"/>
    <stop offset="100%" stop-color="#00e4cc"/>
  </linearGradient>
  <linearGradient id="gr" x1="340" y1="510" x2="535" y2="165" gradientUnits="userSpaceOnUse">
    <stop offset="0%" stop-color="#9d4edd"/>
    <stop offset="100%" stop-color="#ffb800"/>
  </linearGradient>
  <radialGradient id="cg" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#f0e6ff"/>
    <stop offset="44%" stop-color="#a855f7"/>
    <stop offset="100%" stop-color="#9d4edd" stop-opacity="0"/>
  </radialGradient>
</defs>

<!-- Background -->
<rect width="680" height="680" rx="92" fill="url(#bgr)"/>

<!-- Atmospheric micro-nodes -->
<circle cx="108" cy="112" r="2"   fill="#ff5c8a" opacity="0.22"/>
<circle cx="82"  cy="298" r="1.5" fill="#ff5c8a" opacity="0.14"/>
<circle cx="58"  cy="484" r="2"   fill="#9d4edd" opacity="0.16"/>
<circle cx="568" cy="98"  r="2"   fill="#ffb800" opacity="0.22"/>
<circle cx="598" cy="305" r="1.5" fill="#ffb800" opacity="0.14"/>
<circle cx="592" cy="506" r="2"   fill="#9d4edd" opacity="0.15"/>
<circle cx="340" cy="54"  r="1.5" fill="#00e4cc" opacity="0.20"/>
<circle cx="198" cy="594" r="2"   fill="#9d4edd" opacity="0.12"/>
<circle cx="474" cy="602" r="1.5" fill="#9d4edd" opacity="0.12"/>
<circle cx="165" cy="460" r="1.5" fill="#ff5c8a" opacity="0.10"/>
<circle cx="508" cy="442" r="1.5" fill="#ffb800" opacity="0.10"/>

<!-- Faint connection web between tips -->
<path d="M145,165 L340,105 L535,165" fill="none" stroke="white" stroke-width="0.9" opacity="0.06" stroke-dasharray="4,9"/>
<line x1="145" y1="165" x2="535" y2="165" stroke="white" stroke-width="0.7" opacity="0.03" stroke-dasharray="3,9"/>

<!-- Branch outer bloom -->
<path d="M340,510 C230,490 90,340 145,165"  fill="none" stroke="url(#gl)" stroke-width="26" stroke-linecap="round" opacity="0.08"/>
<path d="M340,510 C340,400 340,250 340,105" fill="none" stroke="url(#gc)" stroke-width="26" stroke-linecap="round" opacity="0.08"/>
<path d="M340,510 C450,490 590,340 535,165" fill="none" stroke="url(#gr)" stroke-width="26" stroke-linecap="round" opacity="0.08"/>

<!-- Branch mid bloom -->
<path d="M340,510 C230,490 90,340 145,165"  fill="none" stroke="url(#gl)" stroke-width="12" stroke-linecap="round" opacity="0.20"/>
<path d="M340,510 C340,400 340,250 340,105" fill="none" stroke="url(#gc)" stroke-width="12" stroke-linecap="round" opacity="0.20"/>
<path d="M340,510 C450,490 590,340 535,165" fill="none" stroke="url(#gr)" stroke-width="12" stroke-linecap="round" opacity="0.20"/>

<!-- Branch core -->
<path d="M340,510 C230,490 90,340 145,165"  fill="none" stroke="url(#gl)" stroke-width="4.5" stroke-linecap="round"/>
<path d="M340,510 C340,400 340,250 340,105" fill="none" stroke="url(#gc)" stroke-width="4.5" stroke-linecap="round"/>
<path d="M340,510 C450,490 590,340 535,165" fill="none" stroke="url(#gr)" stroke-width="4.5" stroke-linecap="round"/>

<!-- Sub-branches: Left -->
<path d="M194,413 Q173,399 155,388" fill="none" stroke="#ff5c8a" stroke-width="2.2" stroke-linecap="round" opacity="0.65"/>
<circle cx="155" cy="388" r="5"   fill="#ff5c8a" opacity="0.75"/>
<path d="M142,313 Q122,303 105,295" fill="none" stroke="#ff5c8a" stroke-width="1.6" stroke-linecap="round" opacity="0.44"/>
<circle cx="105" cy="295" r="3.8" fill="#ff5c8a" opacity="0.55"/>

<!-- Sub-branches: Center -->
<path d="M340,341 Q321,332 304,326" fill="none" stroke="#00e4cc" stroke-width="2.2" stroke-linecap="round" opacity="0.65"/>
<circle cx="304" cy="326" r="5"   fill="#00e4cc" opacity="0.75"/>
<path d="M340,257 Q359,248 376,242" fill="none" stroke="#00e4cc" stroke-width="1.6" stroke-linecap="round" opacity="0.44"/>
<circle cx="376" cy="242" r="3.8" fill="#00e4cc" opacity="0.55"/>

<!-- Sub-branches: Right -->
<path d="M486,413 Q507,399 525,388" fill="none" stroke="#ffb800" stroke-width="2.2" stroke-linecap="round" opacity="0.65"/>
<circle cx="525" cy="388" r="5"   fill="#ffb800" opacity="0.75"/>
<path d="M538,313 Q558,303 575,295" fill="none" stroke="#ffb800" stroke-width="1.6" stroke-linecap="round" opacity="0.44"/>
<circle cx="575" cy="295" r="3.8" fill="#ffb800" opacity="0.55"/>

<!-- Left tip node: rose -->
<circle cx="145" cy="165" r="38"  fill="#ff5c8a" opacity="0.06"/>
<circle cx="145" cy="165" r="26"  fill="#ff5c8a" opacity="0.10"/>
<circle cx="145" cy="165" r="17"  fill="#ff5c8a" opacity="0.18"/>
<circle cx="145" cy="165" r="12"  fill="#ff5c8a" opacity="0.82"/>
<circle cx="145" cy="165" r="6.5" fill="#ff8cb3"/>
<circle cx="145" cy="165" r="3"   fill="white"   opacity="0.93"/>

<!-- Center tip node: cyan -->
<circle cx="340" cy="105" r="38"  fill="#00e4cc" opacity="0.06"/>
<circle cx="340" cy="105" r="26"  fill="#00e4cc" opacity="0.10"/>
<circle cx="340" cy="105" r="17"  fill="#00e4cc" opacity="0.18"/>
<circle cx="340" cy="105" r="12"  fill="#00e4cc" opacity="0.82"/>
<circle cx="340" cy="105" r="6.5" fill="#5cf5e4"/>
<circle cx="340" cy="105" r="3"   fill="white"   opacity="0.93"/>

<!-- Right tip node: amber -->
<circle cx="535" cy="165" r="38"  fill="#ffb800" opacity="0.06"/>
<circle cx="535" cy="165" r="26"  fill="#ffb800" opacity="0.10"/>
<circle cx="535" cy="165" r="17"  fill="#ffb800" opacity="0.18"/>
<circle cx="535" cy="165" r="12"  fill="#ffb800" opacity="0.82"/>
<circle cx="535" cy="165" r="6.5" fill="#ffd060"/>
<circle cx="535" cy="165" r="3"   fill="white"   opacity="0.93"/>

<!-- Root / convergence node -->
<circle cx="340" cy="510" r="65"  fill="#9d4edd" opacity="0.04"/>
<circle cx="340" cy="510" r="48"  fill="#9d4edd" opacity="0.06"/>
<circle cx="340" cy="510" r="38"  fill="none" stroke="#9d4edd"  stroke-width="0.8" opacity="0.22"/>
<circle cx="340" cy="510" r="27"  fill="none" stroke="#a855f7"  stroke-width="1.1" opacity="0.38"/>
<circle cx="340" cy="510" r="18"  fill="#08060d" stroke="#c084fc" stroke-width="3"/>
<circle cx="340" cy="510" r="11"  fill="url(#cg)"/>
<circle cx="340" cy="510" r="4.5" fill="#f0e6ff" opacity="0.96"/>
</svg>
