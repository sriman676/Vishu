[package]
name = "vishu-desktop"
version = "0.0.0"
edition = "2021"
description = "Vishu desktop shell — spawns the core and hosts the React UI over vishu.* RPC."

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
